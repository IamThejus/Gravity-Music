name: saragama
description: A modern, minimal YouTube audio player.
publish_to: 'none'
# version: <semver>+<versionCode>. The semver MUST equal the release tag
# (v2.0.0 → 2.0.0) or the in-app updater misfires. versionCode = major*10000 +
# minor*100 + patch, so it always increases with the semver — see "Releasing"
# in CLAUDE.md.
version: 2.1.0+21000

environment:
  sdk: ">=3.1.5 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management & DI
  get: ^4.7.1

  # Audio playback
  just_audio: ^0.9.46
  audio_service: ^0.18.17

  # Desktop (Linux/Windows) audio backend for just_audio + MPRIS for
  # audio_service. These are platform-implementation plugins; they do not
  # affect the Android/iOS plugin set.
  just_audio_media_kit: ^2.0.6
  media_kit_libs_linux: ^1.1.3
  media_kit_libs_windows_audio: ^1.0.9   # bundles libmpv DLLs for the Windows build
  audio_service_mpris: ^1.0.0-beta.1

  # YouTube stream extraction. Upstream (BSD-3-Clause) rather than the old
  # anandnet fork, which stopped working in 2026 — see the resolver notes in
  # services/stream_service.dart. Used as the FALLBACK path only; the primary
  # resolver talks to youtubei directly.
  youtube_explode_dart: ^3.1.0

  # Local caching
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Networking
  http: ^1.2.1
  path_provider: ^2.1.1
  # App version for the anonymous heartbeat (already in the lockfile
  # transitively; promoted so it can be imported directly).
  package_info_plus: ^9.0.1

  # UI
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  palette_generator: ^0.3.3   # dynamic accent color from album art
  share_plus: ^10.1.4         # native share sheet
  scrollable_positioned_list: ^0.3.8  # index-based auto-centering for synced lyrics
  supabase_flutter: ^2.15.0
  google_sign_in: ^7.2.0

# Local patched copy of just_audio_media_kit: disables libmpv `cache-on-disk`
# (media_kit hardcodes it on), which on some Linux setups fails to create the
# on-disk cache and breaks start-of-track seek → no audio. See vendor/.
dependency_overrides:
  just_audio_media_kit:
    path: vendor/just_audio_media_kit

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.0
  flutter_native_splash: ^2.4.4
  msix: ^3.16.7   # packages the Windows build as an installable .msix

# Windows MSIX installer config (read by `dart run msix:create`). No
# certificate is configured, so msix signs with its bundled self-signed test
# certificate — users trust that cert once to install. Swap in a real signing
# cert (certificate_path/certificate_password) for a store/production release.
msix_config:
  display_name: Gravity Music
  publisher_display_name: Anuragh K P and Thejus Asokan
  identity_name: com.saragama.gravitymusic
  msix_version: 1.3.3.0
  logo_path: assets/app_icon.png
  capabilities: internetClient

flutter_launcher_icons:
  android: true
  ios: true
  # Regenerates windows/runner/resources/app_icon.ico from the source PNG so
  # the desktop app no longer ships the default Flutter template icon.
  windows:
    generate: true
    image_path: "assets/app_icon.png"
    icon_size: 256
  image_path: "assets/app_icon.png"
  remove_alpha_ios: true

# Clean logo-on-black splash (Apple Music / Spotify style). The Android 12+
# section overrides the OS default splash (which otherwise shows the launcher
# icon on a white circle). We're always a dark app, so light/dark are identical.
flutter_native_splash:
  color: "#000000"
  image: assets/splash_logo.png
  color_dark: "#000000"
  image_dark: assets/splash_logo.png
  android_12:
    color: "#000000"
    image: assets/splash_logo.png
    color_dark: "#000000"
    image_dark: assets/splash_logo.png
  android: true
  ios: true
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png